<body><main id="phone"><div class="status"><span>9:41</span><span>●●●  ▰</span></div><div id="app" class="screen"></div><div class="home-indicator"></div></main>
<script>
(()=>{
const names=['Shotaro','Eunseok','Sungchan','Wonbin','Sohee','Anton'];
const cn=['将太郎','宋银硕','郑成灿','朴元彬','李炤熙','李灿荣'];
const $=s=>document.querySelector(s);
const app=$('#app');
let state={screen:'intro',me:'',lover:'',nickname:'',chapter:0,trust:50,suspicion:12,public:18,choices:[],dm:0,igPosts:0,ending:''};
const save=()=>{try{localStorage.setItem('riize_crisis_save',JSON.stringify(state))}catch(e){}};
const load=()=>{try{let x=JSON.parse(localStorage.getItem('riize_crisis_save'));if(x&&x.me)state=x}catch(e){}};
function shell(cls,html){app.className='screen '+(cls||'');app.innerHTML=html}
function top(title,back='home'){return `<div class="top"><button onclick="go('${back}')">‹ 返回</button><b>${title}</b><span style="width:42px"></span></div>`}
window.go=(s)=>{state.screen=s;save();render()};
function intro(){shell('intro',`<div class="eyebrow">A FICTIONAL RIIZE FAN SIMULATOR</div><div><h1>恋爱危机，<br>从一张照片开始。</h1><p>你将扮演 RIIZE 的其中一位成员，并与另一位成员秘密恋爱。你们把恋爱藏在日常细节里——同款衣服、下班后的同行、只有彼此看得懂的照片。</p><p>直到某天，粉丝开始察觉不对劲。站姐的小号也向你发来了私信。</p><p>你的每个选择，都会改变恋情、粉圈舆论与故事结局。</p></div><button class="btn-dark" onclick="go('setup')">开始故事　→</button><div class="eyebrow">ALL CHARACTERS ARE USED IN A FICTIONAL FAN STORY</div>`)}
function setup(){shell('setup',`<div class="brand">우리 사이 <span class="muted" style="font-size:12px">· RIIZE</span></div><p class="sub">先决定你是谁，以及你想和谁展开这条故事线。</p><div class="section">01 / 选择你的成员身份</div><div class="members">${names.map((n,i)=>`<button class="member ${state.me===n?'active':''}" onclick="pickMe('${n}')"><strong>${cn[i]}</strong><small>${n}</small></button>`).join('')}</div><div class="section">02 / 选择恋爱对象</div><div class="love-grid">${names.map((n,i)=>`<button class="love ${state.lover===n?'active':''}" ${state.me===n?'disabled':''} onclick="pickLover('${n}')">${cn[i]} <span class="muted">· ${n}</span></button>`).join('')}</div><div class="section">03 / 你的称呼（可选）</div><input class="field" id="nickname" placeholder="例如：我的小号昵称" value="${esc(state.nickname)}"><p class="hint">故事采用虚构情节与虚构社交账号内容。选择身份后，恋爱对象会自动排除你自己。</p><button class="btn-dark" onclick="startStory()">确认设定，进入手机　→</button>`);
}
window.pickMe=n=>{state.me=n;if(state.lover===n)state.lover='';setup()};
window.pickLover=n=>{state.lover=n;setup()};
window.startStory=()=>{state.nickname=$('#nickname').value.trim()||'private';if(!state.me||!state.lover){alert('请先选择成员身份和恋爱对象。');return}state.screen='home';state.chapter=0;save();render()};
function home(){shell('home',`<div class="scroll home"><div style="display:flex;justify-content:space-between;font-size:12px;color:#655d62"><b>MONDAY, 09:41</b><span>♡ 你的私人手机</span></div><div class="widget"><small>오늘의 날씨 · SEOUL</small><div class="time">09:41</div><div style="display:flex;justify-content:space-between"><span>多云转晴　☁</span><small>今天也要小心一点。</small></div></div><div class="appgrid">
${[['💬','KKT','line'],['𝕏','X','x'],['◎','Instagram','ig'],['📷','相册','photos'],['📅','日程','schedule'],['📝','备忘录','notes'],['💌','LYSN','lysn'],['🧵','Threads','threads'],['📩','陌生私信','dm'],['♡','关系状态','status']].map(a=>`<button class="appcell" onclick="go('${a[2]}')"><div class="appicon">${a[0]}</div><span>${a[1]}</span></button>`).join('')}
</div><div class="home-title">TODAY'S NOTE</div><div class="storycard"><b>今天的行程</b><p>10:30 团体练习　/　14:00 拍摄　/　晚上：自由时间<br>经纪人提醒：最近上下班尽量不要单独行动。</p></div><div class="dock"><button class="appcell" onclick="go('line')"><div class="appicon">💬</div></button><button class="appcell" onclick="go('x')"><div class="appicon">𝕏</div></button><button class="appcell" onclick="go('ig')"><div class="appicon">◎</div></button><button class="appcell" onclick="go('dm')"><div class="appicon">📩</div></button></div></div>`)}
function line(){shell('',`${top('KKT · 聊天','home')}<div class="scroll"><div class="xpost"><div class="avatar">经</div><div><b>经纪人</b><div class="muted" style="font-size:11px">今天 08:52</div><p class="postbody">最近网上有一些关于成员关系的讨论。你们几个注意一下上下班动线，不要给拍摄者留下容易误会的画面。</p></div></div><div class="xpost" onclick="go('loverchat')"><div class="avatar">♡</div><div style="flex:1"><b>${cn[names.indexOf(state.lover)]}</b><p class="postbody muted">点开与恋人的聊天记录……</p></div><span class="muted">09:12</span></div><div class="xpost"><div class="avatar">队</div><div><b>RIIZE 群聊</b><p class="postbody">今天练习结束后一起吃饭吗？</p></div></div></div>`)}
function loverchat(){shell('chatbg',`${top(cn[names.indexOf(state.lover)]+' · LINE','line')}<div class="chatmsgs" id="msgs"><div class="date">今天 09:12</div><div class="msg"><div class="bubble">你看到网上那些帖子了吗？好像有人在说我们最近总穿一样的衣服。</div></div><div class="msg me"><div class="bubble">看到了……应该只是巧合吧。</div></div><div class="msg"><div class="bubble">嗯。但昨天一起下班的照片，好像也被拍到了。</div></div></div><div class="choices"><small>你要怎么回复？</small><button class="choice" onclick="replyLover(0)">「先别担心，我会注意的。」<br><span class="muted">安抚对方，维持信任</span></button><button class="choice" onclick="replyLover(1)">「最近暂时不要一起走了。」<br><span class="muted">降低曝光，但可能让对方失落</span></button><button class="choice" onclick="replyLover(2)">「要不然我们公开吧？」<br><span class="muted">大胆表达，风险也会增加</span></button></div>`)}
window.replyLover=i=>{if(i===0)state.trust+=8;if(i===1){state.suspicion-=4;state.trust-=5}if(i===2){state.trust+=3;state.suspicion+=18;state.public+=12}state.choices.push('恋人回复'+i);state.chapter=1;save();go('x')};
const posts=[
['dailyriize','@dailyriize','今天刷到一个细节……他们两个最近是不是有点奇怪？昨天机场图里外套颜色也太像了吧。','♡ 2,431　↻ 381'],
['bluehour','@bluehour','同款衣服而已吧？成员之间关系好、穿搭互相影响不是很正常吗，别什么都往恋爱上扯。','♡ 1,208　↻ 96'],
['archive_02','@archive_02','不是只有衣服啊……上周两个人几乎同一时间下班，而且走的方向也一样。真的只是巧合？','♡ 3,098　↻ 622'],
['alwaysriize','@alwaysriize','拜托，嗑CP不要嗑到现实里。没有证据就不要造谣，也别去打扰成员本人。','♡ 4,821　↻ 703'],
['framebyframe','@framebyframe','站姐图里有一张反光，感觉像是两个人一起坐车？我不确定，先放大看看。','♡ 5,620　↻ 1,104']
];
function xscreen(){let arr=posts.slice(0,Math.min(2+state.chapter,5));shell('xscreen',`${top('𝕏　为你推荐','home')}<div class="scroll"><div style="padding:12px 16px;border-bottom:1px solid #eee;font-weight:750">正在发生的讨论 <span class="muted" style="font-size:11px;font-weight:400">· 虚构时间线</span></div>${arr.map((p,i)=>`<div class="xpost"><div class="avatar">${p[0][0].toUpperCase()}</div><div style="flex:1"><div class="who"><b style="color:#17181c">${p[0]}</b> ${p[1]} · ${i+1}小时</div><div class="body">${p[2]}</div><div class="stats">♡ ${p[3]}</div></div></div>`).join('')}<div class="storycard"><b>讨论热度</b><div class="meter"><i style="width:${Math.min(100,state.suspicion)}%"></i></div><p>目前猜测热度：${state.suspicion}/100。你可以选择继续观察，或处理私人账号与站姐私信。</p></div></div><div class="choices"><small>接下来你想做什么？</small><button class="choice" onclick="go('ig')">查看自己的 Instagram 小号</button><button class="choice" onclick="go('dm')">查看陌生账号的私信请求</button><button class="choice" onclick="go('photos')">回看最近被讨论的照片线索</button><button class="choice" onclick="nextChapter()">继续下一阶段 →</button></div>`)}
function ig(){shell('',`${top('Instagram','home')}<div class="scroll igprofile"><div class="ighead"><div class="igbig">♡</div><div style="flex:1"><b>${esc(state.nickname)}</b><div class="igstats"><span><b>${state.igPosts}</b>帖子</span><span><b>218</b>粉丝</span><span><b>106</b>关注</span></div></div></div><div class="igbio">just little moments ♡<br>private account · only close friends</div><div style="border-top:1px solid #eee;padding:12px 0;font-size:12px;font-weight:700">帖子　　已标记</div><div class="iggrid"><button class="igphoto" onclick="postIG(0)">☕<small>咖啡杯</small></button><button class="igphoto" onclick="postIG(1)">🧥<small>他的外套一角</small></button><button class="igphoto" onclick="postIG(2)">🤍<small>交叠的手</small></button><button class="igphoto" onclick="postIG(3)">🌃<small>夜晚的街道</small></button><button class="igphoto" onclick="postIG(4)">🍰<small>两人份甜点</small></button><button class="igphoto" onclick="postIG(5)">🚘<small>车窗倒影</small></button></div><p class="hint">点选一张照片，决定要不要发布到小号。照片内容为文字/色块示意。</p></div>`)}
window.postIG=i=>{let desc=['一杯咖啡，对面的人没有入镜。','只拍到了他的外套袖口。','照片里出现了两个人的手。','一起走过的夜路。','两份甜点，只有一张桌面。','车窗反光里似乎有另一个人。'][i];showModal('发布这条动态？',`你的照片内容：${desc}<br><br>如果被熟悉你们的人看到，可能会成为新的恋爱线索。`,[{t:'发布到小号',f:()=>{state.igPosts++;state.suspicion+=i===2?13:7;state.public+=4;save();go('ig')}},{t:'先不发布',f:()=>go('ig')}])};
function dm(){shell('',`${top('消息请求','home')}<div class="scroll"><div class="xpost"><div class="avatar">?</div><div style="flex:1"><b>unknown_0821</b><div class="muted" style="font-size:11px">Instagram · 2小时前</div><p class="postbody">你好……你是 ${cn[names.indexOf(state.me)]} 吗？</p><button class="choice" onclick="openDM()">查看消息请求</button></div></div><div class="storycard"><b>陌生账号提醒</b><p>对方没有关注你，但发来了消息。接受后，对方可能知道你已读。</p></div></div>`)}
function openDM(){shell('',`${top('unknown_0821 · 私信','dm')}<div class="chatmsgs chatbg"><div class="date">今天 14:06</div><div class="msg"><div class="bubble">你好，冒昧打扰了。你是 ${cn[names.indexOf(state.me)]} 吗？</div></div><div class="msg"><div class="bubble">我关注你们很久了。最近你和 ${cn[names.indexOf(state.lover)]} 是不是在交往？同款衣服、一起上下班，还有你小号的照片……我好像发现了一些事情。</div></div></div><div class="choices"><small>站姐小号正在等待你的回复</small><button class="choice" onclick="dmReply(0)">「你认错人了。」<br><span class="muted">否认身份，可能引起追问</span></button><button class="choice" onclick="dmReply(1)">「请不要传播没有证实的内容。」<br><span class="muted">设立边界，语气冷静</span></button><button class="choice" onclick="dmReply(2)">「你想要什么？」<br><span class="muted">直接试探对方目的</span></button><button class="choice" onclick="dmReply(3)">不回复，截图保存并联系经纪人。<br><span class="muted">保护自己，减少正面冲突</span></button></div>`)}
window.dmReply=i=>{state.dm=i;if(i===0)state.suspicion+=8;if(i===1)state.suspicion-=2;if(i===2)state.suspicion+=3;if(i===3){state.suspicion-=5;state.trust+=2}state.choices.push('站姐私信'+i);save();showModal('消息已处理', ['你否认了身份。对方没有立刻相信，继续发来一句「真的不是你吗？」','你明确表达了边界。对方暂时停止追问。','对方回复：「我只是想确认，不会随便公开。」','你保存了截图，并把情况告诉了经纪人。'][i], [{t:'继续',f:()=>nextChapter()}])};
function threads(){
const feed=[
['@framebyframe','最近同款衣服的讨论又出现了。只是穿搭相似，真的能说明什么吗？'],
['@bluehour','我觉得大家可以讨论舞台互动，但不要把成员的私人生活当成侦探游戏。'],
['@archive_02','两个人最近确实常常在差不多的时间离开公司，不过也可能只是行程重叠。'],
['@staywithriize','不管关系是什么，都希望大家先尊重他们。没有证据就不要传播。']
];
if(state.chapter>=2)feed.unshift(['@quiet_signal','有人在讨论一个私人账号发出的照片。请不要转发、扒号或尝试确认账号主人。']);
if(state.chapter>=3)feed.unshift(['@lens_note','有账号私信询问成员身份和恋爱关系了。希望不要有人继续越界。']);
shell('',`${top('Threads','home')}<div class="thread-head"><span>Threads</span><button onclick="threadCompose()">＋</button></div><div class="thread-tabs"><span>为你推荐</span><span>正在关注</span></div><div class="scroll">${feed.map((p,i)=>`<div class="thread-post"><div class="thread-avatar">✧</div><div class="thread-body"><div class="thread-meta"><b>${p[0]}</b> · ${i+1}小时</div>${esc(p[1])}<div class="thread-actions"><button onclick="threadReact(${i})">♡ 喜欢</button><button onclick="threadReact(${i})">◯ 回复</button><button onclick="threadReact(${i})">↗ 转发</button></div></div></div>`).join('')}<div class="storycard"><b>话题讨论</b><p>关于 ${cn[names.indexOf(state.me)]} 和 ${cn[names.indexOf(state.lover)]} 的猜测仍未得到证实。粉丝立场不同，但请勿侵犯隐私。</p></div></div>`);
}
window.threadReact=i=>showModal('Threads 互动','你停留在这条讨论下。你可以选择不参与猜测，把注意力放回自己的生活。',[{t:'知道了',f:()=>go('threads')}]);
window.threadCompose=()=>showModal('发布 Threads','你想公开表达什么？',[{t:'希望大家尊重成员隐私',f:()=>{state.choices.push('Threads：呼吁尊重隐私');state.trust+=2;save();go('threads')}},{t:'不发布，继续观察',f:()=>go('threads')}]);
function lysn(){shell('',`${top('LYSN · 私人消息','home')}<div class="scroll"><div class="storycard"><small class="muted">FROM ${cn[names.indexOf(state.lover)]} · 21:48</small><h3>今天辛苦了 ♡</h3><p>练习结束了吗？记得吃点东西。今天网上的讨论我也看到了，不要一个人担心。</p><p>如果觉得不安，就来找我聊聊。我们一起想办法。</p></div><div class="choices"><small>你想怎么回应这条消息？</small><button class="choice" onclick="lysnReply(0)">「看到你的消息就安心多了。」</button><button class="choice" onclick="lysnReply(1)">「我们最近还是小心一点吧。」</button><button class="choice" onclick="lysnReply(2)">「我想见你，哪怕只有十分钟。」</button></div></div>`)}
window.lysnReply=i=>{if(i===0)state.trust+=5;if(i===1){state.suspicion-=3;state.trust-=1}if(i===2){state.trust+=6;state.suspicion+=3}state.choices.push('LYSN回复'+i);save();showModal('消息已发送',['你回复了他。他很快回了一个爱心。','他答应最近会谨慎一些，也提醒你别太紧张。','他回复：「等今天行程结束，我去找你。」'][i],[{t:'返回桌面',f:()=>go('home')},{t:'继续聊天',f:()=>go('line')}])};
function photos(){shell('',`${top('相册 · 最近项目','home')}<div class="scroll"><div class="storycard"><b>最近被粉丝讨论的线索</b><p>这些照片只是故事中的线索描述，不代表真实事件。</p></div>${[['同款衣服','两人在不同日期穿着相似的深灰色连帽外套。'],['上下班时间','两人的离开时间只差了三分钟。'],['收拾与配饰','粉丝发现两人近期使用相似的手机挂饰。'],['IG 小号','小号照片边缘出现疑似另一人的衣袖。']].map(x=>`<div class="xpost"><div class="avatar">▧</div><div><b>${x[0]}</b><p class="postbody">${x[1]}</p></div></div>`).join('')}</div>`)}
function schedule(){shell('',`${top('日程','home')}<div class="scroll"><div class="storycard"><b>MON · 今日行程</b><p>10:30　团体练习<br>14:00　杂志拍摄<br>18:30　集体下班<br>21:00　私人时间</p></div><div class="storycard"><b>提醒</b><p>今天有粉丝在公司附近等待。是否和恋人一起离开，可能影响被拍到的概率。</p><button class="choice" onclick="scheduleChoice(0)">一起离开</button><button class="choice" onclick="scheduleChoice(1)">分开离开，之后再见</button><button class="choice" onclick="scheduleChoice(2)">让经纪人安排车辆</button></div></div>`)}
window.scheduleChoice=i=>{state.suspicion+=i===0?14:i===1?-3:-5;state.trust+=i===1?-2:i===0?4:1;save();showModal('行程已更新',['你们一起离开。虽然短暂相处很开心，但有人拍下了背影。','你们分开离开。风险降低了，但恋人发来一句「今天也不能一起走吗？」','经纪人安排了车辆。你们避开了人群，暂时没有新照片。'][i],[{t:'返回手机',f:()=>go('home')}])};
function notes(){shell('',`${top('备忘录','home')}<div class="scroll"><div class="storycard"><small class="muted">今天 00:17</small><h3>不要忘记的事</h3><p>1. 小号不要再发能看出地点的照片。<br>2. 不要在公开账号留下只有他懂的暗号。<br>3. 如果站姐继续私信，先保存证据。<br>4. 无论发生什么，都要和他好好沟通。</p></div></div>`)}
function status(){shell('',`${top('关系状态','home')}<div class="scroll"><div class="storycard"><b>你与 ${cn[names.indexOf(state.lover)]} 的关系</b><p>信任程度</p><div class="meter"><i style="width:${clamp(state.trust)}%"></i></div><p>${state.trust}/100</p><p>外界怀疑度</p><div class="meter"><i style="width:${clamp(state.suspicion)}%"></i></div><p>${state.suspicion}/100</p><p>粉圈讨论热度</p><div class="meter"><i style="width:${clamp(state.public)}%"></i></div><p>${state.public}/100</p><span class="pill">恋爱路线：${state.lover}</span><span class="pill">身份：${state.me}</span></div><button class="btn-light" style="margin:10px 15px;width:calc(100% - 30px)" onclick="go('setup')">重新选择成员与恋爱对象</button></div>`)}
function nextChapter(){state.chapter++;state.suspicion+=state.chapter===2?9:4;state.public+=state.chapter===2?12:5;save();if(state.chapter>=3){ending();return}showModal(state.chapter===2?'新的线索出现了':'风波继续发酵',state.chapter===2?`一张疑似拍到你们同车的照片在粉丝圈流传。有人开始整理时间线，也有人提醒大家不要越界。${state.lover} 发来消息：「我们需要认真谈谈。」`:`讨论没有停止。有人选择相信你们只是关系好，也有人继续寻找所谓的证据。`,[{t:'查看恋人消息',f:()=>go('loverchat')},{t:'查看 X 上的讨论',f:()=>go('x')},{t:'回到手机桌面',f:()=>go('home')}])}
function ending(){let title,desc;if(state.trust>=58&&state.suspicion<45){title='结局 · 暂时守住的秘密';desc='你们选择坦诚沟通、谨慎处理社交账号，也没有让外界的猜测决定彼此的关系。粉圈讨论逐渐转移，恋情仍然留在只有你们知道的角落。'}else if(state.suspicion>=70){title='结局 · 风暴中心';desc='越来越多的碎片被拼在一起。公司介入处理舆论，你们不得不暂时拉开距离。没有人能替你们决定未来，但这段关系迎来了最艰难的阶段。'}else if(state.trust<40){title='结局 · 渐行渐远';desc='为了避开外界目光，你们减少了联系，却也错过了许多解释的机会。沉默没有让问题消失，反而让彼此开始不安。'}else{title='结局 · 未完待续';desc='风波暂时平息，但你们都知道这并不是最后一次被讨论。接下来要如何面对彼此、粉丝和未来，仍然由你来决定。'}state.ending=title;save();shell('ending',`<div class="eyebrow">RIIZE · LOVE CRISIS SIMULATOR</div><h1>${title}</h1><p>${desc}</p><div class="storycard"><b>本轮结果</b><p>身份：${state.me}<br>恋爱对象：${state.lover}<br>信任：${state.trust}　·　怀疑：${state.suspicion}<br>粉圈热度：${state.public}</p></div><button class="btn-dark" onclick="restart()">重新开始</button><button class="btn-light" style="margin-top:10px" onclick="go('home')">返回手机桌面</button>`)}
function showModal(title,body,buttons){let old=$('.modalback');if(old)old.remove();let el=document.createElement('div');el.className='modalback';el.innerHTML=`<div class="modal"><h3>${title}</h3><p>${body}</p>${buttons.map((b,i)=>`<button class="${i===0?'btn-dark':'btn-light'}" data-i="${i}">${b.t}</button>`).join('')}</div>`;el.querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;el.remove();buttons[i].f()});app.appendChild(el)}
function clamp(x){return Math.max(0,Math.min(100,x))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.restart=()=>{localStorage.removeItem('riize_crisis_save');state={screen:'setup',me:'',lover:'',nickname:'',chapter:0,trust:50,suspicion:12,public:18,choices:[],dm:0,igPosts:0,ending:''};render()};
function render(){switch(state.screen){case'intro':intro();break;case'setup':setup();break;case'home':home();break;case'line':line();break;case'threads':threads();break;case'lysn':lysn();break;case'loverchat':loverchat();break;case'x':xscreen();break;case'ig':ig();break;case'dm':dm();break;case'openDM':openDM();break;case'photos':photos();break;case'schedule':schedule();break;case'notes':notes();break;case'status':status();break;default:home()}}
load();if(state.me&&state.lover&&state.screen!=='intro'&&state.screen!=='setup'){}else state.screen='intro';render();
})();
</script></body></html>
