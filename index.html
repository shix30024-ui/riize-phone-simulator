window.openRequest=function(i){var m=[['lens.archive_02','你好，我想确认一件事。你是'+meName()+'本人吗？'],['framebyframe_','你是不是在和'+loverName()+'谈恋爱？最近有些照片的细节很像。'],['private_camera9','我拍到的公开行程里，你们出现的时间总是很接近。可以聊聊吗。']][i];state.handled[i]=true;showModal('来自 '+m[0]+' 的私信',m[1],[{t:'回复对方',f:function(){state.suspicion=Math.min(100,state.suspicion+9);state.chapter=Math.max(state.chapter,3);state.choices.push('回复站姐小号');save();showModal('你回复了','你没有承认关系，只说希望对方不要继续打探私人生活。',[{t:'返回收件箱',f:function(){inbox()}}])}},{t:'不回复',f:function(){state.choices.push('没有回复站姐');save();inbox()}},{t:'截图发给恋人',f:function(){state.trust=Math.min(100,state.trust+7);state.kktLog.push({from:'me',text:'我收到一个陌生账号的私信，问我是不是在和你谈恋爱。我截图给你了。'});state.choices.push('把站姐私信告诉恋人');save();go('kkt')}}])};
function kkt(){
 var log=state.kktLog.length?state.kktLog:[{from:'lover',text:'今天练习结束得比较晚。你回宿舍了吗？'},{from:'me',text:'刚回来。今天差点在走廊被工作人员撞见。'},{from:'lover',text:'下次我们小心一点。真的很想见你。'}];
 shell('kkt-page','<div class="kkt-head"><h2>KakaoTalk</h2><div class="kkt-actions"><button>⌕</button><button>＋</button></div></div><div class="kkt-section-title">聊天</div><div class="kkt-chatrow" onclick="go(\'loverchat\')"><div class="kkt-avatar">♡</div><div class="chat-meta"><b>'+loverName()+'</b><p>'+esc(log[log.length-1].text)+'</p></div><span class="chat-time">刚刚</span></div><div class="kkt-divider"></div><div class="kkt-section-title">与恋人的秘密聊天室</div><button class="choice" onclick="go(\'loverchat\')">打开和 '+loverName()+' 的聊天　→</button><div class="kkt-bottom"><button class="active"><strong>●</strong>朋友</button><button><strong>◯</strong>聊天</button><button><strong>♙</strong>更多</button></div>');
}
window.sendKktChoice=function(i){var opts=['我也想你。等行程结束后，我们找时间见面吧。','最近有人开始讨论我们了，你也看到了吗？','我有点担心。我们是不是应该暂时减少一起出现的次数？'];var t=opts[i];state.kktLog.push({from:'me',text:t});var answer=['我也想你。再忙也会留时间给你。','看到了。先别慌，我们一起想办法，不要一个人承担。','好，我们先谨慎一点，但不要因为别人的猜测就互相疏远。'][i];state.kktLog.push({from:'lover',text:answer});state.trust=Math.min(100,state.trust+(i===1?8:5));state.choices.push('KKT选择：'+t);if(i===1)state.chapter=Math.max(state.chapter,2);save();loverchat()};
function loverchat(){
 var log=state.kktLog.length?state.kktLog:[{from:'lover',text:'今天好想见你。刚刚看到你发的 IG 了ㅋㅋ 那张照片拍得很可爱。'},{from:'me',text:'差点就把你拍进去了。下次要小心一点。'}];
 var msgs=log.map(function(m){return '<div class="kkt-chat-line '+(m.from==='me'?'mine':'')+'">'+(m.from==='me'?'':'<div class="kkt-mini">♡</div>')+'<div class="kkt-bubble">'+esc(m.text)+'</div></div>'}).join('');
 var choices=state.chapter<4?'<div class="kkt-replybox"><small>选择你的回复</small><button class="choice" onclick="sendKktChoice(0)">我也想你，想快点见到你。</button><button class="choice" onclick="sendKktChoice(1)">有人开始怀疑我们了，我有点担心。</button><button class="choice" onclick="sendKktChoice(2)">最近先小心一点，减少一起出现的机会吧。</button></div>':'<div class="kkt-replybox"><small>你们已经认真谈过这件事。</small><button class="choice" onclick="go(\'status\')">查看关系与结局走向</button></div>';
 shell('kkt-chat-screen','<div class="kkt-chat-head"><button onclick="go(\'kkt\')">‹</button><b>'+loverName()+'</b><button>⋯</button></div><div class="kkt-chat-body"><div class="kkt-chat-date">今天 · 22:16</div>'+msgs+'</div>'+choices);
}
function threads(){
 var seeds=[['@moodboard_021','同款衣服而已，成员之间互相借衣服很正常吧。'],['@cp_archive','我不是说他们一定在谈，但最近互动真的很有氛围。'],['@stay_real','嗑 CP 不等于可以侵犯隐私。不要去搜私人账号。'],['@bluehour','如果只是关系好，希望大家不要过度解读；如果是真的，也希望他们幸福。']];
 var all=(state.threadsPosts||[]).map(function(p){return [p.user,p.text]}).concat(seeds);
 shell('threads-screen','<div class="th-head"><button onclick="go(\'home\')">‹</button><div class="th-logo">Threads</div><button onclick="threadsCompose()">＋</button></div><div class="th-tabs"><button class="active">为你推荐</button><button>正在关注</button></div><div class="th-feed">'+all.map(function(p,i){return '<article class="th-post"><div class="th-avatar">✧</div><div class="th-content"><div class="th-meta"><b>'+esc(p[0])+'</b><span> · '+(i+1)+'小时</span></div><div class="th-text">'+esc(p[1])+'</div><div class="th-actions"><button>♡ '+(23+i*12)+'</button><button>◯ 回复</button><button>⇄ 转发</button></div></div></article>'}).join('')+'</div><div class="th-nav"><button class="active" onclick="threads()">⌂</button><button onclick="threadsCompose()">＋</button><button onclick="go(\'inbox\')">♡</button><button>♙</button></div>');
}
window.threadsCompose=function(){shell('threads-screen','<div class="th-head"><button onclick="threads()">取消</button><div class="th-logo">新建帖子</div><button onclick="threadsPublish()">发布</button></div><div style="padding:18px"><textarea id="threadDraft" class="field" rows="5" placeholder="记录一下今天的心情……"></textarea></div>')};
window.threadsPublish=function(){var el=document.getElementById('threadDraft');if(!el||!el.value.trim())return;state.threadsPosts.unshift({user:'@'+state.igHandle,text:el.value.trim()});state.choices.push('发布 Threads');save();threads()};
function status(){
 var bars=[['关系信任',state.trust],['站姐怀疑',state.suspicion],['粉圈热度',state.public]];
 var html=bars.map(function(b){return '<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>'+b[0]+'</b><span>'+b[1]+'/100</span></div><div class="meter"><i style="width:'+b[1]+'%"></i></div></div>'}).join('');
 shell('screen','<div class="top"><button onclick="go(\'home\')">‹ 返回</button><b>关系状态</b><span></span></div><div class="scroll" style="padding:20px"><div class="storycard"><b>'+meName()+' × '+loverName()+'</b><p>你们的关系仍然处于秘密状态。每一次公开互动、每一张小号照片和每一次私信回复，都会影响接下来的走向。</p></div>'+html+'<div class="section">当前剧情进度</div><p class="hint">第 '+(state.chapter+1)+' 阶段 · '+['秘密日常','粉丝出现怀疑','IG 小号留下线索','站姐私信调查','粉圈争论与关系抉择'][Math.min(state.chapter,4)]+'</p><button class="btn-dark" onclick="advanceStory()">推进下一阶段</button><button class="btn-light" style="margin-top:9px" onclick="getEnding()">查看当前结局倾向</button></div>');
}
window.advanceStory=function(){state.chapter=Math.min(4,state.chapter+1);state.public=Math.min(100,state.public+9);state.suspicion=Math.min(100,state.suspicion+6);state.choices.push('推进剧情阶段');save();showModal('新的风波出现了',['X 上出现同款穿搭对比帖。','粉丝开始把一起上下班的时间整理成时间线。','IG 小号的一张照片被陌生账号截图。','站姐的小号发来更直接的私信。','不同立场的粉丝开始争论：只是队友，还是关系不一般？'][state.chapter],[{t:'继续',f:function(){go(['x','x','ig','inbox','threads'][state.chapter])}}])};
window.getEnding=function(){var title,desc;if(state.suspicion>=72||state.public>=78){title='风暴中心';desc='猜测迅速扩散，你们决定暂时减少公开互动，先保护彼此。'}else if(state.trust>=68&&state.suspicion<48){title='默契守护';desc='你们及时沟通、互相信任，暂时没有让线索变成确凿证据。'}else if(state.public>=45){title='未证实的传闻';desc='粉圈讨论持续，但不同立场仍在争论，没有人能确认真相。'}else{title='平静的秘密';desc='目前没有引起太多注意，你们决定继续谨慎相处。'}state.ending=title;save();showModal('结局倾向 · '+title,desc,[{t:'回到手机',f:function(){go('home')}},{t:'查看状态',f:function(){status()}}])};
function showModal(title,body,actions){var box=document.createElement('div');box.className='modalback';box.innerHTML='<div class="modal"><h3>'+esc(title)+'</h3><p>'+esc(body).replace(/\n/g,'<br>')+'</p>'+(actions||[]).map(function(a,i){return '<button class="'+(i===0?'btn-dark':'btn-light')+'" style="width:100%" data-act="'+i+'">'+esc(a.t)+'</button>'}).join('')+'</div>';app.appendChild(box);box.querySelectorAll('[data-act]').forEach(function(b){b.addEventListener('click',function(){var a=actions[Number(b.getAttribute('data-act'))];box.remove();if(a&&a.f)a.f()})})}
function schedule(){shell('screen',top('今日行程')+'<div class="scroll" style="padding:18px"><div class="storycard"><b>09:30　团体练习</b><p>与成员一起练习新舞台。你和'+loverName()+'需要注意镜头和工作人员。</p></div><div class="storycard"><b>14:00　个人录音</b><p>分组工作，暂时不会和恋人单独见面。</p></div><div class="storycard"><b>19:20　结束行程</b><p>你们约好错开几分钟离开练习室。</p></div><button class="choice" onclick="advanceStory()">查看今天之后发生的事</button></div>')}
function notes(){shell('screen',top('备忘录')+'<div class="scroll" style="padding:18px"><div class="storycard"><b>不要忘记</b><p>1. 不要在公开账号发同框照片。<br>2. 小号发图前检查背景和反光。<br>3. 如果收到可疑私信，先和'+loverName()+'商量。<br>4. 不要让粉丝的猜测影响你们之间的信任。</p></div></div>')}
function photos(){shell('screen',top('相册')+'<div class="scroll" style="padding:18px"><div class="ig-grid">'+state.igPosts.map(function(p){return '<div class="ig-grid-tile">♡</div>'}).join('')+'</div><p class="hint">这里保存着你发布过的私人照片记录。</p></div>')}
function lysn(){shell('screen',top('LYSN')+'<div class="scroll" style="padding:18px"><div class="storycard"><b>Dear. '+loverName()+'</b><p>今天辛苦了。练习结束之后，记得好好吃饭。不要因为网上的讨论就睡不着。</p><p>그리고 보고 싶어 ♡</p><button class="choice" onclick="go(\'kkt\')">去 KKT 回复他</button></div></div>')}
function restart(){if(!confirm('确定清除当前新剧情存档并重新选择身份吗？'))return;localStorage.removeItem('riize_crisis_save_v2');selectedMe='';selectedLover='';state={version:2,screen:'setup',me:'',lover:'',igHandle:'',chapter:0,trust:55,suspicion:12,public:15,igPosts:[],kktLog:[],handled:{},threadsPosts:[],choices:[],ending:''};go('setup')}
function render(){switch(state.screen){case'intro':intro();break;case'setup':setup();break;case'home':home();break;case'x':xscreen();break;case'ig':ig();break;case'inbox':inbox();break;case'kkt':kkt();break;case'loverchat':loverchat();break;case'threads':threads();break;case'status':status();break;case'schedule':schedule();break;case'notes':notes();break;case'photos':photos();break;case'lysn':lysn();break;default:home()}}
load();
if(state.version===2&&state.me&&state.lover){selectedMe=state.me;selectedLover=state.lover;if(state.screen==='setup'||state.screen==='intro')state.screen='home'}else{state.screen='intro'}
render();
})();
</script></body></html>
