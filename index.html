window.threadsProfile=function(){const user=state.threadsUsername||'you_'+(state.igHandle||'daily');const mine=state.threadsUserPosts||[];shell('threads-screen','<div class="th-head"><button onclick="threadsScreen()">‹</button><div class="th-logo" style="font-size:18px">个人主页</div><span></span></div><div class="th-feed"><div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:20px">'+esc(user)+'</b><p style="font-size:12px;color:#888">'+esc(state.nickname||'')+'</p></div><div class="th-avatar" style="width:60px;height:60px">'+esc((state.nickname||'我').slice(0,1))+'</div></div><p style="font-size:13px;color:#666">'+mine.length+' 条帖子　·　你的 Threads 日常</p></div>'+mine.map(p=>'<div class="th-post"><div class="th-content"><div class="th-meta"><b>@'+esc(p.user)+'</b><span>· 刚刚</span></div><div class="th-text">'+esc(p.text)+'</div></div></div>').join('')+'</div>')};
window.threadsComments=function(i){const p=thSeedPosts[i];if(!p)return;threadsOpenComments('seed'+i)};

function seedStoryRequests(){if((Number(state.chapter)||0)<2)return;const m=cn[names.indexOf(state.lover)]||'他';igRequestItems.splice(0,igRequestItems.length,['film210','姐姐，你认识 RIIZE 的'+m+'吗？',3],['plum_mint_98','你的东西和'+m+'是同款。你是他女朋友吗？',4],['after_silver_56','我这里拍到了一些东西，你立即回复我。',2],['peach_92','不要和他买同款了！',3],['quiet_haneul_6','姐姐你和 RIIZE 的'+m+'在谈恋爱吗？',4],['cocoa_dream921','嫂子？？？',2],['peach_orbit_56','我擦等一下，你是'+m+'的🧹吗？？纳尼',3],['bluehour_0321','妈的你能不能别再蹭了，以为自己是嫂子啊？我老公不可能和你在一起的别做梦了大姐。',5]);}
function igInbox(){
 seedStoryRequests();
 const total=state.chapter>=2?igRequestItems.reduce(function(sum,item){return sum+(state.igHandled&&state.igHandled[item[0]]?0:item[2])},0):0;
 shell('igscreen','<div class="ig-inbox-head"><div class="ig-inbox-name">'+esc(igUsername())+'⌄</div><div class="ig-inbox-actions"><button>⌕</button><button>▱</button></div></div><div class="ig-searchbar">⌕　搜索消息</div><div class="ig-inbox-section"><span>消息</span><button onclick="igStrangers()">陌生消息请求 '+(state.chapter>=2?'· '+total:'')+'</button></div><div class="scroll" style="flex:1;min-height:0;padding:14px"><div class="storycard"><b>'+(state.chapter>=2?'你收到了很多陌生消息':'暂时没有新的陌生消息')+'</b><p>'+(state.chapter>=2?'有人开始怀疑你和 '+cn[names.indexOf(state.lover)]+' 的关系。':'你的私信目前很安静。')+'</p><button class="choice" onclick="igStrangers()">打开消息请求</button></div></div>'+igNav('dm'));
}
function igStrangers(){
 seedStoryRequests();
 if(state.chapter<2){showModal('暂时没有陌生消息','目前还没有人注意到你的账号。',[{t:'返回',f:function(){igInbox()}}]);return}
 const total=igRequestItems.reduce(function(sum,item){return sum+(state.igHandled&&state.igHandled[item[0]]?0:item[2])},0);
 shell('igscreen','<div class="ig-request-head"><button onclick="igBackInbox()">‹</button><b>陌生消息请求</b></div><div class="ig-request-summary">陌生消息 · '+total+' 条未读 · '+igRequestItems.length+' 位用户</div><div class="scroll" style="flex:1;min-height:0">'+igRequestItems.map(function(a,i){return '<button class="ig-request-row" style="width:100%;text-align:left;background:#fff" onclick="igOpenStranger('+i+')"><div class="ig-request-avatar">♙</div><div class="ig-request-meta"><b>'+a[0]+'</b><p>'+a[1]+'</p></div><span class="ig-unread">'+(state.igHandled&&state.igHandled[a[0]]?'已处理':a[2])+'</span></button>'}).join('')+'</div>'+igNav('dm'));
}
function igStrangerDetail(){
 const a=igRequestItems[igSelectedStranger]||igRequestItems[0];
 shell('igscreen','<div class="ig-request-head"><button onclick="igStrangers()">‹</button><b>'+a[0]+'</b></div><div class="scroll" style="flex:1;padding:18px"><div class="ig-request-detail"><div class="ig-request-avatar">♙</div><b>'+a[0]+'</b><p>Instagram · 陌生消息请求</p></div><div style="background:#f0f1f4;border-radius:18px;padding:14px;margin-top:18px;line-height:1.6">'+a[1]+'</div><p style="font-size:11px;color:#888;text-align:center;margin-top:20px">对方没有关注你。你可以选择如何处理。</p></div><div class="ig-request-actions" style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px"><button onclick="igHandleRequest(\'reply\')">回复</button><button onclick="igHandleRequest(\'ignore\')">不回复</button><button onclick="igHandleRequest(\'block\')">拉黑</button><button onclick="igHandleRequest(\'restrict\')">限制账号</button><button onclick="igHandleRequest(\'screenshot\')">截图发 KKT</button></div>'+igNav('dm'));
}
window.igHandleRequest=function(action){
 const a=igRequestItems[igSelectedStranger];state.igHandled=state.igHandled||{};state.igHandled[a[0]]=action;
 if(action==='reply'){state.suspicion=clamp(state.suspicion+5);state.choices.push('IG陌生人回复');showModal('回复消息','你回复：「请不要传播没有证实的内容，也不要再联系我。」',[{t:'返回请求',f:function(){igStrangers()}}]);}
 else if(action==='screenshot'){state.trust=clamp(state.trust+4);state.choices.push('截图发给男朋友');state.kktMessages=state.kktMessages||[];state.kktMessages.push({from:'me',text:'我收到陌生私信了，我截图发给你了。'});showModal('截图已发送','你把私信截图发到了 KKT。',[{t:'去 KKT',f:function(){go('loverchat')}}]);}
 else if(action==='block'){state.suspicion=clamp(state.suspicion-2);showModal('账号已拉黑','对方无法继续向你发送消息。',[{t:'返回请求',f:function(){igStrangers()}}]);}
 else if(action==='restrict'){state.suspicion=clamp(state.suspicion-1);showModal('已限制账号','对方的互动受到限制。',[{t:'返回请求',f:function(){igStrangers()}}]);}
 else{state.choices.push('IG陌生人不回复');showModal('你没有回复','你选择暂时不回应这条消息。',[{t:'返回请求',f:function(){igStrangers()}}]);}
 save();
};
window.igBackInbox=function(){igView='inbox';igInbox()};
window.igOpenStranger=function(i){igSelectedStranger=i;igView='strangerDetail';igStrangerDetail()};
window.igDeclineStranger=function(){igHandleRequest('ignore')};
window.igAcceptStranger=function(){igHandleRequest('reply')};
window.xOpenPost=function(i){
 const s=Math.min(6,Math.max(0,Number(state.chapter)||0));
 if(s===0&&i===4){state.chapter=1;state.suspicion=clamp(state.suspicion+7);state.public=clamp(state.public+6);state.choices.push('点击X疑心帖子进入剧情2');save();showModal('剧情2触发 · 讨论开始增加','你点开那条关于他最近总在看手机的帖子。评论区里开始出现更多相似的观察和猜测。',[{t:'查看讨论',f:function(){xscreen()}},{t:'去 KKT 告诉男朋友',f:function(){go('loverchat')}}]);return}
 const phaseNames=['日常讨论','CP 互动讨论','圈外恋情猜测','站姐线索整理','热搜与粉圈争论','舆论压力','最终走向'];
 const replies=s===1?['没有吧，他最近练习很认真啊。','某些人是不是疑心病……','状态好不是好事吗？状态好能把你们克死是不是。','他最近是不是经常穿同一件外套？','你们有没有发现他最近总是在看手机ㅋㅋ','他最近怎么不和队友一辆车啊？']:['没有证据不要乱猜。','请不要去扒普通人的账号。','希望大家尊重当事人的私人生活。'];
 showModal(phaseNames[s]+' · 评论区',replies.map(function(v,j){return '@'+['mood_note','bluehour_17','daily_cloud','film_archive','peachday'][j]+ '：'+v}).join('\n\n'),[{t:'返回时间线',f:function(){xscreen()}}]);
};

load();if(state.me&&state.lover&&state.profileReady&&state.screen!=='intro'&&state.screen!=='setup'){}else state.screen='setup';render();
})();
